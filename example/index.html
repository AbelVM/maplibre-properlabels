<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MapLibre GL — Label Merge Demo</title>
    <link rel="icon" type="image/x-icon" href="https://nimbi.es/favicon.ico">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.21.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.21.1/dist/maplibre-gl.js'></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src='../dist/maplibre-properlabels.js'></script>
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #info {
            position: absolute;
            z-index: 2;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px;
            border-radius: 6px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            font-size: 13px;
            color: #111;
            max-width: 360px;
        }

        #info pre {
            margin: 8px 0 0 0;
            max-height: 260px;
            overflow: auto;
        }

        #controls {
            position: absolute;
            right: 12px;
            top: 12px;
            z-index: 3
        }

        button {
            padding: 6px 10px;
            font-size: 13px
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    demotiles: {
                        type: 'vector',
                        url: 'https://demotiles.maplibre.org/tiles/tiles.json',
                        promoteId: { 'countries': 'fid' }
                    }
                },
                layers: [
                    {
                        id: 'countries-fill',
                        type: 'fill',
                        source: 'demotiles',
                        'source-layer': 'countries',
                        paint: {
                            'fill-color': [
                                "case",
                                ["boolean", ["get", "clipped"], false],
                                '#e6f8ee',
                                '#e6eef8'
                            ],// '#e6eef8',
                            'fill-outline-color': '#9bb6d8'
                        }
                    },
                    {
                        id: 'countries-labels',
                        type: 'symbol',
                        source: 'demotiles',
                        'source-layer': 'countries',
                        layout: {
                            'text-field': ['coalesce', ['get', 'name'], ['get', 'name_en'], ['get', 'NAME'], ''],
                            'text-size': 12,
                            "text-font": ["Montserrat"]
                        },
                        paint: {
                            'text-color': '#000000',
                            'text-halo-color': '#ffffff',
                            'text-halo-width': 1
                        }
                    }
                ]
            },
            center: [-1.8185423452185887, 45.70324604208017],
            zoom: 5
        });

        map.showTileBoundaries = true;

        window.map = map;

        map.on('load', () => {
            const proper = new ProperLabels({
                map: map,
                source: 'demotiles',
                sourceLayer: 'countries'
            });
            map.addLayer({
                id: 'countries-labels-proper',
                type: 'symbol',
                source: 'demotiles-proper',
                layout: {
                    'text-field': ['coalesce', ['get', 'name'], ['get', 'name_en'], ['get', 'NAME'], ''],
                    'text-size': 12,
                    "text-font": ["Montserrat"]
                },
                paint: {
                    'text-color': '#ff0000',
                    'text-halo-color': '#ffffff',
                    'text-halo-width': 1
                }
            });
        });
    </script>
</body>

</html>
