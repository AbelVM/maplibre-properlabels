<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MapLibre GL — Label Merge Demo</title>
    <link rel="icon" type="image/x-icon" href="https://nimbi.es/favicon.ico">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.21.1/dist/maplibre-gl.css' />
    <script src='https://unpkg.com/maplibre-gl@5.21.1/dist/maplibre-gl.js'></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src='../dist/maplibre-properlabels.js'></script>
    <style>
        html,
        body,
        #map {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #eee;
        }

        #info {
            position: absolute;
            z-index: 2;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.95);
            padding: 16px;
            border-radius: 6px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            font-size: 13px;
            color: #111;
            max-width: 360px;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
            pointer-events: none;
        }

        #info pre {
            margin: 8px 0 0 0;
            max-height: 260px;
            overflow: auto;
        }

        #controls {
            position: absolute;
            right: 12px;
            top: 12px;
            z-index: 3
        }

        button {
            padding: 6px 10px;
            font-size: 13px
        }

        .github-link {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 2000;
            width: 52px;
            height: 52px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.93);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #111;
            text-decoration: none;
        }

        .github-link:hover {
            background: #ffffff;
        }

        .github-link svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        /* Legend styles */
        #info .legend-title {
            font-weight: 700;
            margin-bottom: 6px;
        }

        #info ul {
            list-style: none;
            padding: 0;
        }

        #info li {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #111;
        }

        .swatch {
            height: 12px;
            border-radius: 3px;
            display: inline-block;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .swatch.blue {
            background: #e6eef8;
            border-color: #9bb6d8;
        }

        .swatch.green {
            background: #e6f8ee;
            border-color: #9bb6d8;
        }

        .label-sw {
            display: inline-block;
            padding: 2px 0px;
            border-radius: 3px;
            font-weight: 600;
            font-family: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
        }

        .label-sw.black {
            color: #000;
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .label-sw.red {
            color: #ff0000;
            background: #ffffff;
            border: 1px solid rgba(255, 0, 0, 0.15);
        }

        .line-sw {
            height: 2px;
            display: inline-block;
            background: #ff0000;
            border-radius: 2px;
        }

        #info li:not(:first-child) {
            margin-top: 10px;
        }

        #info li>span {
            width: 3rem;
            text-align: center;
        }

        #info label {
            pointer-events: all !important;
        }
    </style>
</head>

<body>
    <a class="github-link" href="https://github.com/AbelVM/maplibre-properlabels" target="_blank"
        rel="noopener noreferrer" aria-label="Open GitHub repository" title="View repository on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd"
                d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
        </svg>
    </a>
    <div id="map"></div>
    <div id="info" role="region" aria-label="Map legend">

        <ul>
            <li><span class="label-sw black" aria-hidden="true">Label</span> <label><input type="radio" name="label"
                        id="black" value="black_checkbox" checked />MapLibre labels for polygons </label></li>
            <li><span class="label-sw red" aria-hidden="true">Label</span> <label><input type="radio" name="label"
                        id="red" value="red_checkbox" />The proper labels</label></li>
            <li><span class="swatch blue" aria-hidden="true"></span> Not clipped countries</li>
            <li><span class="swatch green" aria-hidden="true"></span> Clipped countries</li>
            <li><span class="line-sw" aria-hidden="true"></span> <label><input type="checkbox" id="tiles"
                        value="tiles_checkbox" />Tile boundaries</label></li>
        </ul>
    </div>
    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    demotiles: {
                        type: 'vector',
                        url: 'https://demotiles.maplibre.org/tiles/tiles.json',
                        promoteId: { 'countries': 'fid' }
                    }
                },
                layers: [
                    {
                        id: 'countries-fill',
                        type: 'fill',
                        source: 'demotiles',
                        'source-layer': 'countries',
                        paint: {
                            'fill-color': [
                                "case",
                                ["boolean", ["get", "clipped"], false],
                                '#e6f8ee',
                                '#e6eef8'
                            ],// '#e6eef8',
                            'fill-outline-color': '#9bb6d8'
                        }
                    },
                    {
                        id: 'countries-labels',
                        type: 'symbol',
                        source: 'demotiles',
                        'source-layer': 'countries',
                        layout: {
                            'text-field': ['coalesce', ['get', 'name'], ['get', 'name_en'], ['get', 'NAME'], ''],
                            'text-size': 12,
                            "text-font": ["Montserrat"]
                        },
                        paint: {
                            'text-color': '#000000',
                            'text-halo-color': '#ffffff',
                            'text-halo-width': 1
                        }
                    }
                ]
            },
            center: [-1.8185423452185887, 45.70324604208017],
            zoom: 5
        });

        window.map = map;

        map.on('load', () => {
            const proper = new ProperLabels({
                map: map,
                source: 'demotiles',
                sourceLayer: 'countries',
                debug: true
            });
            map.addLayer({
                id: 'countries-labels-proper',
                type: 'symbol',
                source: 'demotiles-proper',
                layout: {
                    'text-field': ['coalesce', ['get', 'name'], ['get', 'name_en'], ['get', 'NAME'], ''],
                    'text-size': 12,
                    "text-font": ["Montserrat"],
                    'visibility': 'none'
                },
                paint: {
                    'text-color': '#ff0000',
                    'text-halo-color': '#ffffff',
                    'text-halo-width': 1
                }
            });
        });

        const
            redlabel = document.querySelector('#red'),
            blacklabel = document.querySelector('#black'),
            redline = document.querySelector('#tiles');

        redlabel.addEventListener('change', e => {
            map.setLayoutProperty('countries-labels-proper', 'visibility', e.target.checked ? 'visible' : 'none');
            map.setLayoutProperty('countries-labels', 'visibility', e.target.checked ? 'none' : 'visible');
        });
        blacklabel.addEventListener('change', e => {
            map.setLayoutProperty('countries-labels', 'visibility', e.target.checked ? 'visible' : 'none');
            map.setLayoutProperty('countries-labels-proper', 'visibility', e.target.checked ? 'none' : 'visible');
        });
        redline.addEventListener('change', e => {
            map.showTileBoundaries = e.target.checked;
        });

    </script>
</body>

</html>
